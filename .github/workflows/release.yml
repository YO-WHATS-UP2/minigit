name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build and test tools
        run: python -m pip install --upgrade build pytest

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(PYTHONPATH=src python -c 'from minigit import __version__; print(__version__)')"
          EXPECTED_TAG="v${VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match minigit version ${VERSION} (expected ${EXPECTED_TAG})."
            exit 1
          fi

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install the built wheel
        shell: bash
        run: |
          WHEEL_INSTALL_DIR="${RUNNER_TEMP}/minigit-wheel"
          python -m pip install --no-deps --target "${WHEEL_INSTALL_DIR}" dist/*.whl
          echo "WHEEL_INSTALL_DIR=${WHEEL_INSTALL_DIR}" >> "${GITHUB_ENV}"

      - name: Test the installed wheel
        shell: bash
        run: |
          cd "${RUNNER_TEMP}"
          export PYTHONPATH="${WHEEL_INSTALL_DIR}"
          python -c 'import minigit, os; path=os.path.realpath(minigit.__file__); root=os.path.realpath(os.environ["WHEEL_INSTALL_DIR"]); assert os.path.commonpath([path, root]) == root, f"Imported minigit from {path}, not the built wheel at {root}"'
          python -m pytest "${GITHUB_WORKSPACE}/tests" -v

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
